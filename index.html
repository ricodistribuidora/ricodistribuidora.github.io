const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abre(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:IT,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},k,u(C));
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
}

  catch(_){try{localStorage.removeItem('rico_pw')}catch(__){}document.getElementById('e').textContent='Senha incorreta.'}});
